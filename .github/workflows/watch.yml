name: Pokemon availability
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'config.json'
      - '.github/workflows/watch.yml'
permissions:
  contents: write
concurrency:
  group: pokemon-availability
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run logic tests
        run: python3 -m unittest -v
      - name: Scan shops
        env:
          WATCH_ENABLED: ${{ vars.WATCH_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 runner.py
      - name: Persist public product observations
        if: always() && vars.WATCH_ENABLED == 'true'
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update product observations [skip ci]'
              git push
            fi
          fi
